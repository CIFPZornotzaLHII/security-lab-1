<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrL" markerWidth="12" markerHeight="12" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#16a34a"/></marker>
    <filter id="s8" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="1" y="1" width="878" height="438" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">TCP: el saludo de 3 pasos y los estados de un puerto</text>

  <!-- left: handshake -->
  <g filter="url(#s8)"><rect x="30" y="72" width="410" height="332" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/></g>
  <text x="235" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Handshake (puerto abierto)</text>

  <text x="110" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Atacante</text>
  <text x="360" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Servidor</text>
  <line x1="110" y1="142" x2="110" y2="372" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="360" y1="142" x2="360" y2="372" stroke="#cbd5e1" stroke-width="2"/>

  <g font-size="12" font-weight="700" font-family="'Consolas','Courier New',monospace">
    <line x1="110" y1="176" x2="360" y2="196" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrR)"/>
    <text x="235" y="176" text-anchor="middle" fill="#15803d">SYN  →</text>

    <line x1="360" y1="232" x2="110" y2="252" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrL)"/>
    <text x="235" y="232" text-anchor="middle" fill="#15803d">←  SYN / ACK</text>

    <line x1="110" y1="288" x2="360" y2="308" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrR)"/>
    <text x="235" y="288" text-anchor="middle" fill="#15803d">ACK  →</text>
  </g>
  <text x="235" y="352" text-anchor="middle" font-size="11.5" fill="#16a34a">Conexión establecida → el puerto está ABIERTO</text>
  <text x="235" y="374" text-anchor="middle" font-size="10.5" fill="#94a3b8">Si estuviera cerrado, el servidor responde SYN → RST</text>

  <!-- right: port states -->
  <g filter="url(#s8)"><rect x="462" y="72" width="388" height="332" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/></g>
  <text x="656" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">¿Qué significa cada estado?</text>

  <g>
    <rect x="486" y="122" width="340" height="76" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <circle cx="512" cy="150" r="9" fill="#22c55e"/>
    <text x="536" y="148" font-size="14" font-weight="700" fill="#166534">open (abierto)</text>
    <text x="536" y="170" font-size="11.5" fill="#15803d">Un servicio está escuchando y acepta conexiones.</text>
    <text x="536" y="187" font-size="11.5" fill="#15803d">Es lo que buscamos: aquí hay algo que investigar.</text>

    <rect x="486" y="210" width="340" height="76" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="512" cy="238" r="9" fill="#ef4444"/>
    <text x="536" y="236" font-size="14" font-weight="700" fill="#b91c1c">closed (cerrado)</text>
    <text x="536" y="258" font-size="11.5" fill="#dc2626">El equipo responde, pero no hay servicio</text>
    <text x="536" y="275" font-size="11.5" fill="#dc2626">escuchando en ese puerto (responde RST).</text>

    <rect x="486" y="298" width="340" height="80" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <circle cx="512" cy="328" r="9" fill="#eab308"/>
    <text x="536" y="326" font-size="14" font-weight="700" fill="#854d0e">filtered (filtrado)</text>
    <text x="536" y="348" font-size="11.5" fill="#a16207">No hay respuesta clara: un cortafuegos</text>
    <text x="536" y="365" font-size="11.5" fill="#a16207">probablemente descarta los paquetes.</text>
  </g>
</svg>
