<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="s2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="878" height="428" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Del Dockerfile al Contenedor</text>
  <text x="440" y="66" text-anchor="middle" font-size="14" fill="#64748b">Una <tspan font-weight="700" fill="#2496ED">imagen</tspan> es la plantilla (de solo lectura); un <tspan font-weight="700" fill="#16a34a">contenedor</tspan> es una instancia en ejecución</text>

  <!-- Dockerfile -->
  <g filter="url(#s2)">
    <rect x="40" y="120" width="170" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="125" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Dockerfile</text>
  <g font-family="'Consolas','Courier New',monospace" font-size="10.5" fill="#334155">
    <text x="58" y="176">FROM kali</text>
    <text x="58" y="194">RUN apt install</text>
    <text x="58" y="212">COPY . /app</text>
    <text x="58" y="230">CMD ["bash"]</text>
  </g>
  <text x="125" y="256" text-anchor="middle" font-size="10.5" fill="#94a3b8">receta / instrucciones</text>

  <!-- Image -->
  <g filter="url(#s2)">
    <rect x="355" y="120" width="170" height="150" rx="12" fill="#e0f2fe" stroke="#2496ED" stroke-width="2.5"/>
  </g>
  <text x="440" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">Imagen</text>
  <g>
    <rect x="378" y="166" width="124" height="18" rx="3" fill="#bae6fd"/>
    <rect x="378" y="188" width="124" height="18" rx="3" fill="#7dd3fc"/>
    <rect x="378" y="210" width="124" height="18" rx="3" fill="#38bdf8"/>
  </g>
  <text x="440" y="252" text-anchor="middle" font-size="10.5" fill="#0369a1">capas inmutables (read-only)</text>

  <!-- Container -->
  <g filter="url(#s2)">
    <rect x="670" y="120" width="170" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  </g>
  <text x="755" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Contenedor</text>
  <circle cx="712" cy="200" r="24" fill="#22c55e"/>
  <path d="M700 200 l8 8 l16 -18" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="782" y="196" text-anchor="middle" font-size="11" fill="#166534" font-weight="600">en</text>
  <text x="782" y="210" text-anchor="middle" font-size="11" fill="#166534" font-weight="600">ejecución</text>
  <text x="755" y="252" text-anchor="middle" font-size="10.5" fill="#15803d">proceso aislado + capa escribible</text>

  <!-- arrows build / run -->
  <line x1="214" y1="195" x2="350" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="236" y="172" width="92" height="22" rx="11" fill="#1e293b"/>
  <text x="282" y="187" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" font-family="'Consolas','Courier New',monospace">build</text>

  <line x1="529" y1="195" x2="665" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="551" y="172" width="92" height="22" rx="11" fill="#1e293b"/>
  <text x="597" y="187" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" font-family="'Consolas','Courier New',monospace">run</text>

  <!-- Registry -->
  <g filter="url(#s2)">
    <rect x="300" y="320" width="280" height="76" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  </g>
  <text x="440" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">Registro — Docker Hub</text>
  <text x="440" y="372" text-anchor="middle" font-size="11.5" fill="#7e22ce">catálogo de imágenes públicas listas para usar</text>
  <text x="440" y="388" text-anchor="middle" font-size="10.5" fill="#9333ea" font-family="'Consolas','Courier New',monospace">docker pull kalilinux/kali-rolling</text>

  <!-- pull arrow registry -> image -->
  <path d="M410 318 C 410 294, 440 294, 440 274" stroke="#9333ea" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="340" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9333ea" font-family="'Consolas','Courier New',monospace">pull</text>
</svg>
