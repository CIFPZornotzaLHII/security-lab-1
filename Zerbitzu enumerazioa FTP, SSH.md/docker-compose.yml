services:
    ftp-server:
      container_name: my-ftp-server
      environment:
        - PUBLIC_IP=192.168.0.1
        - FTP_PASS=louise
        - FTP_USER=user
      image: garethflowers/ftp-server
      # ports:
        # - "20-21:20-21/tcp"
        # - "40000-40009:40000-40009/tcp" # For passive mode
      volumes:
        - "/data:/home/user"

    anon-ftp:
      image: metabrainz/docker-anon-ftp
      # ports:
        # - "20-21:20-21"
        # - "65500-65515:65500-65515"
      volumes:
        - "/tmp:/var/ftp:ro"

    